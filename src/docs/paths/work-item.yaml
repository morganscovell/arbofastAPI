/work-item/images:
    post:
        summary: Upload work item images
        tags:
            - Work Item

        security:
            - bearerAuth: []

        requestBody:
            required: true
            content:
                multipart/form-data:
                    schema:
                        type: object
                        properties:
                            image:
                                type: array
                                items:
                                    type: string
                                    format: binary

        responses:
            '201':
                description: Images uploaded successfully

            '400':
                description: No images provided

# -------------------------

/work-item:
    post:
        summary: Create work item
        tags:
            - Work Item

        security:
            - bearerAuth: []

        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateWorkItemRequest'

        responses:
            '201':
                description: Work item created successfully

            '400':
                description: Validation error

    put:
        summary: Update work item

        tags:
            - Work Item

        security:
            - bearerAuth: []

        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateWorkItemRequest'

        responses:
            '200':
                description: Work item updated successfully

            '400':
                description: Validation error

# -------------------------

/work-item/{id}:
    get:
        summary: Get work item by ID

        tags:
            - Work Item

        security:
            - bearerAuth: []

        parameters:
            - in: path
              name: id
              required: true
              example: 1
              schema:
                  type: integer

        responses:
            '200':
                description: Work item fetched successfully
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WorkItemResponse'

            '400':
                description: Invalid ID

            '401':
                description: Unauthorized

    delete:
        summary: Delete work item

        tags:
            - Work Item

        security:
            - bearerAuth: []

        parameters:
            - in: path
              name: id
              required: true
              example: 1
              schema:
                  type: integer

        responses:
            '200':
                description: Work item deleted successfully

            '400':
                description: Invalid ID

            '401':
                description: Unauthorized
