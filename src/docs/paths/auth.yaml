/signup:
    post:
        summary: Register User
        description: Create a new account
        tags:
            - Auth

        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SignupRequest'

                    examples:
                        signup:
                            value:
                                username: Abdul Haseeb
                                email: haseeb@gmail.com
                                password: Password@123
                                phone: '+923001234567'
                                address: Karachi, Sindh

        responses:
            '201':
                description: User created successfully

            '409':
                description: Email or username already exists

            '400':
                description: Validation failed

            '500':
                description: Internal server error

/signin:
    post:
        summary: User Sign In
        description: Authenticate user and return user's data with JWT token
        tags:
            - Auth

        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SigninRequest'

                    examples:
                        signin:
                            value:
                                email: haseeb@gmail.com
                                password: Password@123

        responses:
            '200':
                description: Login successful

            '401':
                description: Invalid credentials

            '500':
                description: Internal server error

/me:
    get:
        summary: Get authenticated user
        description: Returns logged-in user information
        tags:
            - Auth

        security:
            - bearerAuth: []

        responses:
            '200':
                description: User authentication data

            '401':
                description: Unauthorized user

            '500':
                description: Internal server error

/verify-token:
    get:
        summary: Verify Firebase token & get authenticated user
        description: |
            Verifies Firebase token from Authorization header.
            If user exists in database, returns user data.
            If user does not exist, creates a new user and returns created user data.

        tags:
            - Auth

        security:
            - bearerAuth: []

        responses:
            '200':
                description: Signin successfully

            '400':
                description: Invalid OAuth data

            '401':
                description: Invalid firebase token

            '500':
                description: Internal server error
